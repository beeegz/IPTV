<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <style>
    .breath{animation:breath 4s ease-in-out infinite;transform-origin:256px 420px}
    .eye{animation:blink 5s infinite;transform-box:view-box}
    .ear-l{animation:twitch 7s infinite;transform-origin:150px 240px}
    .ear-r{animation:twitch 9s 2s infinite reverse;transform-origin:362px 240px}
    @keyframes breath{50%{transform:translateY(5px) scale(1.01)}}
    @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
    @keyframes twitch{0%,90%,100%{transform:rotate(0)}93%{transform:rotate(-7deg)}96%{transform:rotate(3deg)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cff"/><stop offset="1" stop-color="#22b8e6"/></linearGradient>
  <clipPath id="frame"><rect width="512" height="512" rx="112"/></clipPath></defs>
  
  <g class="breath">
    <g clip-path="url(#frame)">
      <path d="M104 540c0-80 60-120 152-120s152 40 152 120z" fill="#fbfaf7"/>
      <path d="M356 452c36-6 58 22 58 88h-84c18-26 28-56 26-88z" fill="#e0913f"/>
    </g>
    <!-- petites pattes -->
    <ellipse cx="208" cy="468" rx="30" ry="22" fill="#fff"/><ellipse cx="304" cy="468" rx="30" ry="22" fill="#fff"/>
    <g stroke="#f3c3c0" stroke-width="5" stroke-linecap="round"><path d="M200 470v6M210 470v6M220 470v6M296 470v6M306 470v6M316 470v6"/></g>
    <!-- oreilles arrondies -->
    <g class="ear-l"><polygon points="120,238 132,112 232,176" fill="#8f6f4c" stroke="#8f6f4c" stroke-width="34" stroke-linejoin="round"/>
      <polygon points="142,214 148,142 202,180" fill="#f5b9b4" stroke="#f5b9b4" stroke-width="12" stroke-linejoin="round"/></g>
    <g class="ear-r"><polygon points="392,238 380,112 280,176" fill="#8f6f4c" stroke="#8f6f4c" stroke-width="34" stroke-linejoin="round"/>
      <polygon points="370,214 364,142 310,180" fill="#f5b9b4" stroke="#f5b9b4" stroke-width="12" stroke-linejoin="round"/></g>
    <!-- grosse tête ronde -->
    <clipPath id="head"><ellipse cx="256" cy="304" rx="176" ry="140"/></clipPath>
    <ellipse cx="256" cy="304" rx="176" ry="140" fill="#9a7a55"/>
    <g clip-path="url(#head)">
      <path d="M180 150c30-24 122-24 152 0l-22 44h-108z" fill="#3a2f28"/>
      <path d="M212 196l8 -30M240 192l5 -30M272 192l-5 -30M300 196l-8 -30" stroke="#9a7a55" stroke-width="8" stroke-linecap="round"/>
      <ellipse cx="202" cy="212" rx="30" ry="38" fill="#e0913f" transform="rotate(14 202 212)"/>
      <ellipse cx="310" cy="212" rx="30" ry="38" fill="#e0913f" transform="rotate(-14 310 212)"/>
      <path d="M234 160q22-12 44 0l14 110q50 30 76 90q-22 90-112 90t-112-90q26-60 76-90z" fill="#fffdf9"/>
      <ellipse cx="256" cy="392" rx="140" ry="70" fill="#fffdf9"/>
    </g>
    <!-- joues roses -->
    <ellipse cx="148" cy="364" rx="28" ry="16" fill="#ff9fb2" opacity=".55"/>
    <ellipse cx="364" cy="364" rx="28" ry="16" fill="#ff9fb2" opacity=".55"/>
    <!-- gros yeux brillants -->
    <g class="eye" style="transform-origin:190px 304px"><circle cx="190" cy="304" r="38" fill="#a9cf86" stroke="#3a2f28" stroke-width="7"/><ellipse cx="190" cy="306" rx="22" ry="28" fill="#1d2418"/><circle cx="204" cy="290" r="11" fill="#fff"/><circle cx="178" cy="322" r="5.500" fill="#fff" opacity=".9"/></g>
    <g class="eye" style="transform-origin:322px 304px"><circle cx="322" cy="304" r="38" fill="#a9cf86" stroke="#3a2f28" stroke-width="7"/><ellipse cx="322" cy="306" rx="22" ry="28" fill="#1d2418"/><circle cx="336" cy="290" r="11" fill="#fff"/><circle cx="310" cy="322" r="5.500" fill="#fff" opacity=".9"/></g>
    <!-- petit nez et sourire -->
    <path d="M243 354q13-8 26 0q-3 12-13 17q-10-5-13-17z" fill="#f08fa0"/>
    <path d="M256 371v8m0 0q-9 12-22 3m22-3q9 12 22 3" fill="none" stroke="#b5707c" stroke-width="5" stroke-linecap="round"/>
    <g class="whisk" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none" opacity=".9">
      <path d="M110 346q-30-6-52-20M108 366q-32 2-56-6M402 346q30-6 52-20M404 366q32 2 56-6"/>
    </g>
  </g>
</svg>
