<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d14">
<title>Mimou TV</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar" id="topbar">
  <a class="brand" href="#" data-view="home"><img src="logo.png" alt=""><span>MIMOU <b>TV</b></span></a>
  <nav class="tabs" id="tabs">
    <button data-view="home" class="active">Accueil</button>
    <button data-view="live">Direct</button>
    <button data-view="movies">Films</button>
    <button data-view="series">Séries</button>
    <button data-view="favs">Favoris</button>
  </nav>
  <div class="actions">
    <label class="search" id="searchBox">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 14 15.5l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>
      <input id="search" type="search" placeholder="Rechercher une chaîne…" autocomplete="off">
    </label>
    <button class="btn" id="addSource">+ Source</button>
  </div>
</header>

<main id="main">
  <section id="hero" class="hero"></section>
  <div id="chips" class="chips"></div>
  <div id="content"></div>
</main>

<nav class="bottomnav" id="bottomnav">
  <button data-view="home" class="active"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Accueil</button>
  <button data-view="live"><svg viewBox="0 0 24 24"><path d="M21 3H3a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5v2h8v-2h5a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm0 14H3V5h18z"/></svg>Direct</button>
  <button data-view="movies"><svg viewBox="0 0 24 24"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V4z"/></svg>Films</button>
  <button data-view="favs"><svg viewBox="0 0 24 24"><path d="M12 17.3l6.2 3.7-1.6-7L22 9.2l-7.2-.6L12 2 9.2 8.600 2 9.200l5.400 4.800-1.600 7z"/></svg>Favoris</button>
  <button id="bnSearch"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.8l-.3-.3A6.500 6.500 0 1 0 14 15.500l.3.3v.8l5 5 1.500-1.500-5-5z"/></svg>Chercher</button>
</nav>

<!-- Lecteur -->
<div class="player" id="player" hidden>
  <div class="stage">
    <video id="video" controls playsinline autoplay></video>
    <div class="overlay top">
      <button class="icon" id="closePlayer" title="Fermer (Échap)">✕</button>
      <div class="meta"><h2 id="pTitle"></h2><p id="pSub"></p></div>
      <button class="icon" id="pFav" title="Favori (F)">☆</button>
      <button class="icon" id="pReload" title="Rafraîchir">⟳</button>
    </div>
    <div class="status" id="status"><span id="statusTxt"></span></div>
    <button class="zap prev" id="prevCh" title="Chaîne précédente (←)">‹</button>
    <button class="zap next" id="nextCh" title="Chaîne suivante (→)">›</button>
  </div>
  <aside class="sidelist">
    <h3>Dans la même catégorie</h3>
    <div id="sideItems"></div>
  </aside>
</div>

<!-- Ajout de source -->
<dialog id="sourceDlg">
  <form method="dialog" id="sourceForm">
    <h2>Ajouter une source</h2>
    <div class="seg" id="srcType">
      <button type="button" class="on" data-t="xtream">Xtream (identifiants)</button>
      <button type="button" data-t="m3u">Playlist M3U</button>
    </div>
    <div id="fsXtream">
      <label>URL du serveur
        <input id="xUrl" type="text" inputmode="url" autocapitalize="off" autocorrect="off" placeholder="http://exemple.com:8080">
      </label>
      <label>Nom d'utilisateur
        <input id="xUser" type="text" autocapitalize="off" autocorrect="off" autocomplete="username">
      </label>
      <label>Mot de passe
        <input id="xPass" type="password" autocomplete="current-password">
      </label>
      <div class="checks">
        <label><input type="checkbox" id="xLive" checked> Direct</label>
        <label><input type="checkbox" id="xMovies" checked> Films</label>
        <label><input type="checkbox" id="xSeries"> Séries</label>
      </div>
    </div>
    <div id="fsM3u" hidden>
      <label>URL de la playlist
        <input id="srcUrl" type="url" placeholder="https://exemple.com/playlist.m3u">
      </label>
      <label>…ou fichier M3U
        <input id="srcFile" type="file" accept=".m3u,.m3u8,.txt,audio/x-mpegurl">
      </label>
    </div>
    <p class="err" id="srcErr"></p>
    <div class="row">
      <button type="button" class="btn ghost" id="loadDemo">Démo</button>
      <span class="spacer"></span>
      <button type="button" class="btn ghost" id="srcCancel">Annuler</button>
      <button type="submit" class="btn" id="srcOk">Importer</button>
    </div>
    <p class="muted small">Mimou TV est seulement un lecteur : aucune chaîne n'est fournie. Vos identifiants restent dans ce navigateur. Certains serveurs bloquent l'accès depuis un navigateur (CORS / HTTP) ; l'application Android n'a pas cette limite.</p>
  </form>
</dialog>

<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script src="app.js"></script>
</body>
</html>
